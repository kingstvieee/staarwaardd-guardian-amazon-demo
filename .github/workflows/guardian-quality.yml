name: Guardian demo quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test Guardian safety and MCP protocol
        run: npm test
      - name: Build offline judge artifact
        run: npm run test:media
      - name: Check generated judge artifact
        run: test -s dist/guardian-demo.html
